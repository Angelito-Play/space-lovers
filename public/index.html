<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Angel Invaders (Prototipo)</title>
  <style>
    html, body { margin:0; padding:0; background:#0b1020; }
    canvas { display:block; margin:0 auto; }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script>
    const W = 900, H = 600;

    const POWER_TYPES = ["TRIPLE", "PIERCE", "RAPID", "SHIELD", "SPEED"];
    const POWER_LABEL = {
      TRIPLE: "Triple",
      PIERCE: "Perforante",
      RAPID:  "Rápido",
      SHIELD: "Escudo",
      SPEED:  "Velocidad"
    };

    const config = {
      type: Phaser.AUTO,
      width: W,
      height: H,
      physics: {
        default: "arcade",
        arcade: { debug: false }
      },
      scene: { preload, create, update }
    };

    new Phaser.Game(config);

    function preload(){}

    function create(){
      const scene = this;

      const stars = scene.add.graphics();
      stars.fillStyle(0xffffff, 0.25);
      for (let i=0;i<120;i++){
        stars.fillRect(Phaser.Math.Between(0,W), Phaser.Math.Between(0,H), 2, 2);
      }

      scene.state = {
        lives: 3,
        invaderDir: 1,
        invaderSpeed: 55,
        invaderDrop: 18,
        lastPlayerShot: 0,
        baseFireDelay: 240,
        primaryPower: null,
        primaryPowerUntil: 0,
        shieldHits: 0,
        speedUntil: 0,
        waveCleared: false,
        bossActive: false
      };

      scene.ui = {
        lives: scene.add.text(14, 10, "Vidas: 3", { fontFamily:"system-ui, sans-serif", fontSize:"18px", color:"#d7e7ff" }),
        power: scene.add.text(14, 34, "Power: -", { fontFamily:"system-ui, sans-serif", fontSize:"18px", color:"#d7e7ff" }),
        hint:  scene.add.text(14, H-26, "Mover: A/D o ←/→ | Disparar: ESPACIO", { fontFamily:"system-ui, sans-serif", fontSize:"14px", color:"#9bb2d6" })
      };

      scene.player = scene.add.text(W/2, H-65, "👼", { fontSize:"44px" }).setOrigin(0.5);
      scene.physics.add.existing(scene.player);
      scene.player.body.setCollideWorldBounds(true);
      scene.player.body.setSize(28, 36, true);

      scene.playerArrows = scene.physics.add.group();
      scene.enemyDrops = scene.physics.add.group();
      scene.invaders = scene.physics.add.group();
      scene.clouds = scene.physics.add.group();
      scene.powerups = scene.physics.add.group();

      // ---- TEXTURAS BÁSICAS (una vez) ----
      const g = scene.add.graphics();
      g.clear();
      g.fillStyle(0xffffff, 1);
      g.fillRect(7, 6, 2, 12);               // palito
      g.fillTriangle(8, 0, 2, 8, 14, 8);     // punta
      g.generateTexture("arrowTex", 16, 18);
      g.destroy();

      scene.keys = scene.input.keyboard.addKeys({
        left: Phaser.Input.Keyboard.KeyCodes.LEFT,
        right: Phaser.Input.Keyboard.KeyCodes.RIGHT,
        a: Phaser.Input.Keyboard.KeyCodes.A,
        d: Phaser.Input.Keyboard.KeyCodes.D,
        space: Phaser.Input.Keyboard.KeyCodes.SPACE
      });

      spawnInvaders(scene);

      scene.physics.add.overlap(scene.playerArrows, scene.invaders, (arrow, invader) => onArrowHitsHeart(scene, arrow, invader));
      scene.physics.add.overlap(scene.enemyDrops, scene.player, (drop) => onEnemyHitsPlayer(scene, drop));
      scene.physics.add.overlap(scene.powerups, scene.player, (p) => onPickup(scene, p));

      scene.physics.add.overlap(scene.enemyDrops, scene.clouds, (drop, cloud) => {
        drop.destroy();
      });

      scene.add.text(W/2, 110, "Angel Invaders", { fontFamily:"system-ui, sans-serif", fontSize:"42px", color:"#e9f2ff" }).setOrigin(0.5);
      scene.add.text(W/2, 152, "Enamora corazones con flechas: ❤️ → ☁️", { fontFamily:"system-ui, sans-serif", fontSize:"18px", color:"#b9ccef" }).setOrigin(0.5);

      function spawnInvaders(scene){
        scene.invaders.clear(true, true);
        scene.clouds.clear(true, true);
        scene.enemyDrops.clear(true, true);
        scene.powerups.clear(true, true);

        scene.state.waveCleared = false;
        scene.state.bossActive = false;
        scene.state.invaderDir = 1;
        scene.state.invaderSpeed = 55;

        const rows = 5, cols = 11;
        const startX = 160, startY = 120, gapX = 55, gapY = 48;

        for (let r=0;r<rows;r++){
          for (let c=0;c<cols;c++){
            const x = startX + c*gapX;
            const y = startY + r*gapY;
            const heart = scene.add.text(x, y, "❤️", { fontSize:"34px" }).setOrigin(0.5);
            scene.physics.add.existing(heart);
            heart.body.setImmovable(true);
            heart.body.setAllowGravity(false);
            heart.body.setSize(26, 26, true);
            heart.data = { state:"HEART", shootCooldown: Phaser.Math.Between(700, 1800) };
            scene.invaders.add(heart);
          }
        }
      }

      scene.spawnInvaders = () => spawnInvaders(scene);
    }

    function update(time, delta){
      const scene = this;
      const s = scene.state;

      const left = scene.keys.left.isDown || scene.keys.a.isDown;
      const right = scene.keys.right.isDown || scene.keys.d.isDown;
      let speed = 320;
      if (time < s.speedUntil) speed += 160;

      scene.player.body.setVelocityX(0);
      if (left) scene.player.body.setVelocityX(-speed);
      if (right) scene.player.body.setVelocityX(speed);

      const fireDelay = (s.primaryPower === "RAPID" && time < s.primaryPowerUntil) ? 110 : s.baseFireDelay;
      if (scene.keys.space.isDown && time - s.lastPlayerShot > fireDelay){
        s.lastPlayerShot = time;
        shootArrow(scene, time);
      }

      scene.ui.lives.setText("Vidas: " + s.lives);

      let pText = "-";
      if (s.primaryPower && time < s.primaryPowerUntil) pText = POWER_LABEL[s.primaryPower] + " (" + Math.ceil((s.primaryPowerUntil - time)/1000) + "s)";
      if (time >= s.primaryPowerUntil) s.primaryPower = null;

      let extras = [];
      if (s.shieldHits > 0) extras.push("Escudo x" + s.shieldHits);
      if (time < s.speedUntil) extras.push("Velocidad (" + Math.ceil((s.speedUntil - time)/1000) + "s)");
      scene.ui.power.setText("Power: " + pText + (extras.length ? " | " + extras.join(" | ") : ""));

      if (!s.bossActive){
        updateInvaderBlock(scene, time, delta);
        invaderShooting(scene, time, delta);

        if (!s.waveCleared && scene.invaders.countActive(true) === 0){
          s.waveCleared = true;
          spawnBoss(scene, time);
        }
      } else {
        updateBoss(scene, time, delta);
      }

      scene.playerArrows.children.each(a => { if (a.active && a.y < -40) a.destroy(); });
      scene.enemyDrops.children.each(d => { if (d.y > H + 60) d.destroy(); });
      scene.powerups.children.each(p => { if (p.y > H + 60) p.destroy(); });
      scene.clouds.children.each(c => { if (c.y < -60) c.destroy(); });
    }

    function shootArrow(scene, time){
      const s = scene.state;
      const x = scene.player.x;
      const y = scene.player.y - 22;

      const isTriple = (s.primaryPower === "TRIPLE" && time < s.primaryPowerUntil);
      const isPierce = (s.primaryPower === "PIERCE" && time < s.primaryPowerUntil);

      const angles = isTriple ? [-12, 0, 12] : [0];

      angles.forEach(aDeg => {
        const arrow = scene.physics.add.image(x, y, "arrowTex");
        arrow.setDepth(5);
        arrow.body.setAllowGravity(false);
        arrow.body.setVelocity(0, -520);

        if (aDeg !== 0){
          const rad = Phaser.Math.DegToRad(aDeg);
          arrow.body.setVelocityX(Math.sin(rad) * 220);
        }

        arrow.body.setSize(10, 16, true);
        arrow.data = { pierce: isPierce, hitsLeft: isPierce ? 99 : 1 };
        scene.playerArrows.add(arrow);
      });
    }

    function updateInvaderBlock(scene, time, delta){
      const s = scene.state;
      const invs = scene.invaders.getChildren();
      if (!invs.length) return;

      let minX = 99999, maxX = -99999, maxY = -99999;
      invs.forEach(h => {
        if (!h.active) return;
        minX = Math.min(minX, h.x);
        maxX = Math.max(maxX, h.x);
        maxY = Math.max(maxY, h.y);
      });

      const hitLeft = (minX < 60);
      const hitRight = (maxX > W - 60);

      if (hitLeft || hitRight){
        s.invaderDir *= -1;
        invs.forEach(h => { if (h.active) h.y += s.invaderDrop; });
        s.invaderSpeed = Math.min(160, s.invaderSpeed + 6);
      }

      const dx = s.invaderDir * (s.invaderSpeed * delta / 1000);
      invs.forEach(h => { if (h.active) h.x += dx; });

      if (maxY > H - 140){
        loseLife(scene, "Los corazones tocaron el suelo.");
      }
    }

    function invaderShooting(scene, time, delta){
      const invs = scene.invaders.getChildren().filter(h => h.active);
      if (!invs.length) return;

      const shooters = Phaser.Utils.Array.Shuffle(invs).slice(0, 3);
      shooters.forEach(h => {
        if (h.data.state !== "HEART") return;

        h.data.shootCooldown -= delta;
        if (h.data.shootCooldown <= 0){
          h.data.shootCooldown = Phaser.Math.Between(700, 1700);
          spawnEnemyDrop(scene, h.x, h.y + 18);
        }
      });
    }

    function spawnEnemyDrop(scene, x, y){
      const drop = scene.add.text(x, y, "💧", { fontSize:"22px" }).setOrigin(0.5);
      scene.physics.add.existing(drop);
      drop.body.setAllowGravity(false);
      drop.body.setVelocity(Phaser.Math.Between(-40, 40), Phaser.Math.Between(240, 320));
      drop.body.setSize(14, 18, true);
      scene.enemyDrops.add(drop);
    }

    function onArrowHitsHeart(scene, arrow, heart){
      arrow.data.hitsLeft -= 1;
      if (arrow.data.hitsLeft <= 0) arrow.destroy();
      if (heart.data.state !== "HEART") return;

      heart.setText("☁️");
      heart.setStyle({ fontSize:"34px" });
      heart.data.state = "CLOUD";

      scene.invaders.remove(heart);
      scene.clouds.add(heart);

      heart.body.setVelocity(Phaser.Math.Between(-35, 35), Phaser.Math.Between(-70, -110));

      if (Math.random() < 0.18){
        spawnPower(scene, heart.x, heart.y + 10);
      }
    }

    function spawnPower(scene, x, y){
      const type = POWER_TYPES[Phaser.Math.Between(0, POWER_TYPES.length-1)];
      const p = scene.add.text(x, y, "✨", { fontSize:"26px" }).setOrigin(0.5);
      scene.physics.add.existing(p);
      p.body.setAllowGravity(false);
      p.body.setVelocity(Phaser.Math.Between(-30, 30), Phaser.Math.Between(90, 130));
      p.body.setSize(18, 18, true);
      p.data = { type };
      scene.powerups.add(p);

      const tag = scene.add.text(x, y-22, POWER_LABEL[type], { fontFamily:"system-ui, sans-serif", fontSize:"12px", color:"#ffe7a6" }).setOrigin(0.5);
      scene.tweens.add({
        targets: tag,
        y: tag.y - 20,
        alpha: 0,
        duration: 700,
        onComplete: () => tag.destroy()
      });
    }

    function onPickup(scene, p){
      const s = scene.state;
      const type = p.data.type;
      p.destroy();
      const now = scene.time.now;

      if (type === "TRIPLE" || type === "PIERCE" || type === "RAPID"){
        s.primaryPower = type;
        s.primaryPowerUntil = now + 12000;
        return;
      }

      if (type === "SHIELD"){
        s.shieldHits = Math.min(3, s.shieldHits + 1);
        return;
      }
      if (type === "SPEED"){
        s.speedUntil = now + 9000;
        return;
      }
    }

    function onEnemyHitsPlayer(scene, drop){
      drop.destroy();
      const s = scene.state;

      if (s.shieldHits > 0){
        s.shieldHits -= 1;
        flash(scene.player, scene);
        return;
      }
      loseLife(scene, "Te alcanzó una lágrima existencial.");
    }

    function loseLife(scene, reason){
      const s = scene.state;
      s.lives -= 1;
      shake(scene);
      flash(scene.player, scene);

      if (s.lives <= 0){
        gameOver(scene);
        return;
      }

      scene.enemyDrops.clear(true, true);
      scene.playerArrows.clear(true, true);
      scene.powerups.clear(true, true);

      if (s.bossActive && scene.boss){
        scene.boss.destroy();
        s.bossActive = false;
      }

      scene.spawnInvaders();
    }

    function gameOver(scene){
      scene.physics.pause();
      scene.add.rectangle(W/2, H/2, 520, 190, 0x000000, 0.65).setOrigin(0.5);
      scene.add.text(W/2, H/2 - 20, "GAME OVER", { fontFamily:"system-ui, sans-serif", fontSize:"44px", color:"#ffccd5" }).setOrigin(0.5);
      scene.add.text(W/2, H/2 + 30, "Recarga la página para intentarlo otra vez.", { fontFamily:"system-ui, sans-serif", fontSize:"18px", color:"#d7e7ff" }).setOrigin(0.5);
    }

    function spawnBoss(scene, time){
      const s = scene.state;
      s.bossActive = true;

      const boss = scene.add.text(W/2, 120, "💖", { fontSize:"96px" }).setOrigin(0.5);
      scene.physics.add.existing(boss);
      boss.body.setAllowGravity(false);
      boss.body.setImmovable(true);
      boss.body.setSize(90, 90, true);
      boss.data = {
        hp: 70,
        phase: 1,
        dir: 1,
        speed: 120,
        shootTimer: 0,
        glowUntil: 0,
        vulnerable: true
      };

      scene.boss = boss;
      scene.physics.add.overlap(scene.playerArrows, boss, (arrow, b) => onArrowHitsBoss(scene, arrow, b));

      const t = scene.add.text(W/2, 56, "BOSS: Corazón Gigante", { fontFamily:"system-ui, sans-serif", fontSize:"22px", color:"#ffd6e8" }).setOrigin(0.5);
      scene.tweens.add({ targets: t, alpha: 0, duration: 1800, onComplete: () => t.destroy() });
    }

    function updateBoss(scene, time, delta){
      const boss = scene.boss;
      if (!boss || !boss.active) return;

      const d = boss.data;

      if (d.hp <= 45 && d.phase === 1){
        d.phase = 2;
        boss.setText("💔");
        d.speed = 160;
      }
      if (d.hp <= 18 && d.phase === 2){
        d.phase = 3;
        boss.setText("💛");
        d.speed = 190;
        d.glowUntil = 0;
      }

      boss.x += d.dir * (d.speed * delta / 1000);
      if (boss.x < 90){ boss.x = 90; d.dir = 1; }
      if (boss.x > W-90){ boss.x = W-90; d.dir = -1; }

      d.shootTimer -= delta;
      if (d.shootTimer <= 0){
        if (d.phase === 1){
          d.shootTimer = 520;
          bossShootCone(scene, boss.x, boss.y + 40, 3, 120);
        } else if (d.phase === 2){
          d.shootTimer = 420;
          bossShootCone(scene, boss.x, boss.y + 40, 5, 160);
          if (Math.random() < 0.22){
            spawnMiniAdds(scene);
          }
        } else {
          if (time > d.glowUntil){
            d.glowUntil = time + 1200;
            d.vulnerable = true;
            pulse(scene, boss);
            d.shootTimer = 260;
          } else {
            d.vulnerable = false;
            d.shootTimer = 360;
          }
          bossShootCone(scene, boss.x, boss.y + 40, 6, 210);
        }
      }
    }

    function bossShootCone(scene, x, y, count, spread){
      for (let i=0;i<count;i++){
        const t = (count === 1) ? 0 : (i/(count-1) - 0.5);
        const vx = t * spread + Phaser.Math.Between(-15, 15);
        const vy = Phaser.Math.Between(260, 340);
        const drop = scene.add.text(x, y, "💧", { fontSize:"22px" }).setOrigin(0.5);
        scene.physics.add.existing(drop);
        drop.body.setAllowGravity(false);
        drop.body.setVelocity(vx, vy);
        drop.body.setSize(14, 18, true);
        scene.enemyDrops.add(drop);
      }
    }

    function spawnMiniAdds(scene){
      for (let i=0;i<5;i++){
        const x = 220 + i*90;
        const y = 210;
        const h = scene.add.text(x, y, "❤️", { fontSize:"30px" }).setOrigin(0.5);
        scene.physics.add.existing(h);
        h.body.setImmovable(true);
        h.body.setAllowGravity(false);
        h.body.setSize(22, 22, true);
        h.data = { state:"HEART", shootCooldown: Phaser.Math.Between(600, 1200), mini:true };
        scene.invaders.add(h);

        scene.tweens.add({
          targets: h,
          y: y + 80,
          duration: 900,
          ease: "Sine.easeInOut"
        });
      }
    }

    function onArrowHitsBoss(scene, arrow, boss){
      const d = boss.data;
      arrow.data.hitsLeft -= 1;
      if (arrow.data.hitsLeft <= 0) arrow.destroy();

      if (d.phase === 3 && !d.vulnerable) return;

      d.hp -= 1;
      flash(boss, scene);

      if (d.hp <= 0){
        const cloud = scene.add.text(boss.x, boss.y, "☁️", { fontSize:"120px" }).setOrigin(0.5);
        scene.physics.add.existing(cloud);
        cloud.body.setAllowGravity(false);
        cloud.body.setVelocity(Phaser.Math.Between(-40, 40), -90);

        boss.destroy();
        scene.state.bossActive = false;

        scene.add.rectangle(W/2, H/2, 560, 220, 0x000000, 0.65).setOrigin(0.5);
        scene.add.text(W/2, H/2 - 30, "VICTORIA CELESTIAL", { fontFamily:"system-ui, sans-serif", fontSize:"40px", color:"#d9fff2" }).setOrigin(0.5);
        scene.add.text(W/2, H/2 + 22, "Convertiste el drama en nubecitas.", { fontFamily:"system-ui, sans-serif", fontSize:"18px", color:"#d7e7ff" }).setOrigin(0.5);
        scene.add.text(W/2, H/2 + 58, "Recarga para volver a repartir amor armado.", { fontFamily:"system-ui, sans-serif", fontSize:"14px", color:"#9bb2d6" }).setOrigin(0.5);

        scene.physics.pause();
      }
    }

    function flash(target, scene){
      scene.tweens.add({ targets: target, alpha: 0.2, yoyo: true, repeat: 2, duration: 70 });
    }
    function shake(scene){ scene.cameras.main.shake(160, 0.008); }
    function pulse(scene, target){
      scene.tweens.add({ targets: target, scale: 1.07, yoyo: true, repeat: 4, duration: 110 });
    }
  </script>
</body>
</html>
